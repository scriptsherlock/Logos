<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Logos Architecture Feedback Loop</title>
  <desc id="desc">A loop shows teacher rubrics, student work, and backend AI feedback cycling together, with supporting connections to JSON storage, an OpenAI-compatible feedback provider, and the built frontend.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f1b18"/>
    </marker>
    <marker id="mutedArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f655d"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f1b18" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1120" height="560" rx="28" fill="#f7f4ef"/>
  <text x="560" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#1f1b18">Logos Architecture</text>
  <text x="560" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" letter-spacing="2" fill="#7b6f66">STUDENT AND TEACHER FEEDBACK LOOP</text>

  <g fill="none" stroke="#1f1b18" stroke-width="2.6" stroke-linecap="round">
    <path d="M 198 166 C 308 92 482 105 568 206" marker-end="url(#arrow)"/>
    <path d="M 622 307 C 582 445 390 480 232 394" marker-end="url(#arrow)"/>
    <path d="M 166 352 C 102 286 116 214 170 180" marker-end="url(#arrow)"/>
  </g>

  <g filter="url(#softShadow)">
    <rect x="78" y="134" width="230" height="96" rx="16" fill="#ffffff" stroke="#ded8cf"/>
    <text x="193" y="171" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f1b18">Teacher UI</text>
    <text x="193" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7b6f66">Rubrics + class insight</text>

    <rect x="78" y="330" width="230" height="96" rx="16" fill="#ffffff" stroke="#ded8cf"/>
    <text x="193" y="367" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f1b18">Student UI</text>
    <text x="193" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7b6f66">Work + revisions</text>

    <rect x="430" y="224" width="260" height="110" rx="18" fill="#1f1b18" stroke="#1f1b18"/>
    <text x="560" y="268" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#ffffff">Node Backend</text>
    <text x="560" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#d9d2ca">server.js feedback engine</text>

    <rect x="817" y="105" width="230" height="88" rx="16" fill="#ffffff" stroke="#ded8cf"/>
    <text x="932" y="140" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f1b18">JSON Data Store</text>
    <text x="932" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7b6f66">data/logos.db.json</text>

    <rect x="817" y="236" width="230" height="88" rx="16" fill="#ffffff" stroke="#ded8cf"/>
    <text x="932" y="268" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f1b18">Feedback Provider</text>
    <text x="932" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7b6f66">OpenAI-compatible</text>

    <rect x="817" y="367" width="230" height="88" rx="16" fill="#ffffff" stroke="#ded8cf"/>
    <text x="932" y="399" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f1b18">Built Frontend</text>
    <text x="932" y="427" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7b6f66">frontend/dist</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#6f655d">
    <rect x="318" y="116" width="170" height="28" rx="14" fill="#f7f4ef"/>
    <text x="403" y="134" text-anchor="middle">rubrics define the target</text>
    <rect x="330" y="438" width="170" height="28" rx="14" fill="#f7f4ef"/>
    <text x="415" y="456" text-anchor="middle">feedback supports revision</text>
    <rect x="48" y="258" width="210" height="28" rx="14" fill="#f7f4ef"/>
    <text x="153" y="276" text-anchor="middle">class patterns inform teaching</text>
  </g>

  <g fill="none" stroke="#6f655d" stroke-width="2.2" stroke-linecap="round">
    <path d="M 690 260 C 750 226 760 149 817 149" marker-end="url(#mutedArrow)"/>
    <path d="M 690 280 L 817 280" marker-end="url(#mutedArrow)"/>
    <path d="M 690 302 C 750 336 760 411 817 411" marker-end="url(#mutedArrow)"/>
  </g>
</svg>
